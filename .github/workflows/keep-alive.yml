name: Repository keep-alive (monitor schedule)

# GitHub disables scheduled workflows in a repository after 60 days without repository activity.
# This weekly commit to .github/monitor-heartbeat.txt keeps api-monitor.yml's schedule enabled.
# Kept separate from the monitor so that the monitor runs with issues:write only (least privilege):
# this workflow processes no external input and only writes one file. Added 2026-10-25 (v3 split).

on:
  schedule:
    - cron: "7 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Commit heartbeat file
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"; path=".github/monitor-heartbeat.txt"
          sha=$(gh api "repos/$repo/contents/$path" --jq .sha 2>/dev/null || true)
          content=$(printf 'monitor keep-alive: %s (%s)\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" | base64 -w0)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$repo/contents/$path" -f message="chore(monitor): weekly keep-alive" -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api -X PUT "repos/$repo/contents/$path" -f message="chore(monitor): weekly keep-alive" -f content="$content" >/dev/null
          fi
          echo "heartbeat committed"
